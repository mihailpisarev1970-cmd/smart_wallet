; Два процесса в контейнере wallet:
;   webhook — aiohttp :8080 (вебхуки MAX и ЮKassa)
;   admin   — gunicorn :8000 (Django-админка)

[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid

[program:webhook]
command=python -m bot.webhook_server
directory=/app
autostart=true
autorestart=true
startretries=10
startsecs=10
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/app/logs/service.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/app"

[program:admin]
command=gunicorn admin_panel.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 90 --access-logfile - --error-logfile -
directory=/app/admin_panel
autostart=true
autorestart=true
startretries=10
startsecs=10
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/app/logs/admin.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/app"
