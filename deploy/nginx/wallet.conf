# wallet.pisarev-n8n.ru — «Умный кошелёк»
# Проксирует запросы к контейнеру wallet (127.0.0.1:8081 бот, 127.0.0.1:8001 админка).
#
#   :80  → ACME challenge + redirect на HTTPS
#   :443 → все location
#
# Корень ведёт в админку. Служебные пути бота доступны только по явному URL.

server {
    listen 80;
    listen [::]:80;
    server_name wallet.pisarev-n8n.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wallet.pisarev-n8n.ru;

    ssl_certificate     /etc/letsencrypt/live/wallet.pisarev-n8n.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wallet.pisarev-n8n.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;
    access_log /var/log/nginx/wallet.access.log;
    error_log  /var/log/nginx/wallet.error.log;

    # --- Корень ведёт в админку ---
    location = / {
        return 302 /admin/;
    }

    # --- Бот: вебхуки MAX и ЮKassa ---
    location /webhook/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location /yookassa/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location /pay/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8081;
        access_log off;
    }

    # --- Django-админка ---
    location /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location /static/ {
        alias /opt/wallet/static/;
        expires 30d;
        access_log off;
    }

    location / {
        return 404;
    }
}
